/* =====================================================================
   SLOT 3 — VALUE MODEL (redraft, 12-team, full PPR, TE premium, superflex)
   Any player without a number in the CSV "value" column gets a value
   from his positional rank here. Type a value in the CSV to override.

   How it works:
   1. curves: average points per game by positional finish (QB1, QB2, ...)
      under this league's scoring: pass yd 0.04, pass TD 4, INT -2,
      rush/rec yd 0.1, rush/rec TD 6, reception 1, 2-pt 2, TE reception
      +0.5, fumble lost -2. Regular season weeks 1-17, 2023-2025,
      players with 8+ games. Source: nflverse.
   2. replacement: PPG of the first non-starter at each position once
      every lineup slot is filled (1QB 2RB 3WR 1TE 1FLEX 1SF x 12 teams
      -> 24 QB, 29 RB, 39 WR, 16 TE starting).
   3. waiver: PPG of the first unrostered player at each position, with
      6 bench spots per team assumed as 1 QB, 2 RB, 2 WR, 1 TE
      -> 36 QB, 53 RB, 63 WR, 28 TE rostered league-wide.
   4. value = PPG above replacement (full credit)
            + PPG between waiver and replacement x benchWeight
      scaled so the best player is 10,000. At or below waiver = 0.
   5. tiers: within each positional tier, values are pulled toward the
      tier's average (tierBlend), so players in a tier sit close together
      and dropping a tier costs real value. tierMinDrop guarantees the
      first player of a tier is at least that much below the last
      player of the tier above.
   6. projections: project_players.py projects every player from this
      season's usage + betting-line team environment (proj_score). The
      site re-orders your ranked players at each position by that score,
      keeping the same rank spots, so the projection gives a second
      opinion on your order. Both ranks are read off the same curve, then
      blended before step 4:
        PPG used = (1 - w) x curve[your rank] + w x curve[projected rank]
        w = maxWeight x games / (games + halfWeightGames)
      So rankings lead early in the season and projections gain weight
      as games pile up. Players with no games this season are rank-only.
   7. rank order: within a position, a player can never be worth more
      than someone you ranked above him. Where the projection would flip
      two players, their values meet in the middle (isotonic regression),
      and your higher-ranked player keeps a slight edge. Projections still
      shape the size of gaps and how positions compare.
   ===================================================================== */

// Weight a player's projection gets, based on games played this season
function projectionWeight(games) {
  const pr = VALUE_MODEL.projection || {};
  if (!(games > 0)) return 0;
  return (pr.maxWeight ?? 0) * games / (games + (pr.halfWeightGames ?? 4));
}

// PPG the value model uses: your rank on the curve, blended with the projected rank
function blendedPPG(pos, posRank, projRank, games) {
  const c = VALUE_MODEL.curves[pos];
  const at = r => c[Math.min(r, c.length) - 1];
  const w = projRank >= 1 ? projectionWeight(games) : 0;
  return (1 - w) * at(posRank) + w * (projRank >= 1 ? at(projRank) : 0);
}

function modelValue(pos, posRank, projRank = null, games = 0) {
  const m = VALUE_MODEL;
  if (!m.curves[pos] || !(posRank >= 1)) return null;
  const raw = (p, ppg) => {
    const starter = Math.max(0, ppg - m.replacement[p]);
    const bench = Math.max(0, Math.min(ppg, m.replacement[p]) - m.waiver[p]);
    return starter + bench * m.benchWeight;
  };
  const top = Math.max(...Object.keys(m.curves).map(p => raw(p, m.curves[p][0])));
  return Math.round(10000 * raw(pos, blendedPPG(pos, posRank, projRank, games)) / top);
}

/* =====================================================================
   SLOT 2 — TRADE MODEL (with waiver adjustment)
   Receives the players each team GETS ({ name, pos, value, ... }).
   Returns { scoreA, scoreB, note } — higher score = more value received.

   Why adjust: a lineup only has so many slots, so two good players are
   usually worth less than one great one, and every extra player you take
   back costs you a roster spot. Two parts:

   1. Star premium: each player counts as 10,000 x (value / 10,000) ^ STAR_POWER.
      Stars keep nearly all their value; depth players shrink. With 1.3,
      a 10,000 player = 10,000 but a 5,000 player counts as about 4,060,
      so two 5,000s (about 8,120) no longer beat one 10,000.
   2. Roster spots: the team receiving MORE players has to cut someone for
      each extra player, roughly a fringe bench / waiver-level player
      (ROSTER_SPOT_VALUE, about what RB50 / WR54 / TE24 are worth).
      That cost is subtracted from the side getting more bodies.
   3. Best player boost: the side getting the single most valuable player
      gets BEST_PLAYER_BONUS x the gap between the two sides' best players
      (star-premium values). A big gap at the top = a big boost; two
      top players of similar value = almost none.
   In a 1-for-1, whoever gets the more valuable player still wins; the
   boost only widens the margin.
   ===================================================================== */
const STAR_POWER = 1.3;
const ROSTER_SPOT_VALUE = 250;
const BEST_PLAYER_BONUS = 0.25;

function tradeModel(sideA, sideB) {
  const adj = v => 10000 * Math.pow(Math.max(v, 0) / 10000, STAR_POWER);
  const raw = side => side.reduce((sum, p) => sum + p.value, 0);
  const starred = side => side.reduce((sum, p) => sum + adj(p.value), 0);
  const extra = sideA.length - sideB.length;
  const spotA = extra > 0 ? extra * ROSTER_SPOT_VALUE : 0;
  const spotB = extra < 0 ? -extra * ROSTER_SPOT_VALUE : 0;
  const top = side => Math.max(0, ...side.map(p => adj(p.value)));
  const gap = sideA.length && sideB.length ? top(sideA) - top(sideB) : 0;
  const boostA = gap > 0 ? BEST_PLAYER_BONUS * gap : 0;
  const boostB = gap < 0 ? BEST_PLAYER_BONUS * -gap : 0;
  const scoreA = starred(sideA) - spotA + boostA, scoreB = starred(sideB) - spotB + boostB;
  // Net swing the adjustment creates, shown in the same units as the totals
  const swing = Math.round((scoreA - scoreB) - (raw(sideA) - raw(sideB)));
  let note = "";
  if (sideA.length && sideB.length && (sideA.length > 1 || sideB.length > 1) && swing !== 0) {
    const toward = swing > 0 ? "A" : "B", more = extra > 0 ? "A" : "B";
    note = `Waiver adjustment: ${Math.abs(swing).toLocaleString("en-US")} toward Team ${toward}`
      + (extra ? ` (Team ${toward} gets the best player in the deal; Team ${more} takes on ${Math.abs(extra)} extra player${Math.abs(extra) > 1 ? "s" : ""} and has to cut ${Math.abs(extra) > 1 ? "them" : "one"}).`
               : ` (Team ${toward} gets the best player in the deal).`);
  }
  return { scoreA, scoreB, rawA: raw(sideA), rawB: raw(sideB), note };
}

/* =====================================================================
   TIER NAMES
   Your CSV keeps tier NUMBERS; the site shows the name for each number.
   ALL applies to every position. A position block (QB, RB, WR, TE)
   overrides ALL for that position only. OVERALL names the tiers on the
   overall board (the overall_tier column). Any tier without a name
   shows as "Tier 3", etc.
   ===================================================================== */
const TIER_NAMES = {
  ALL: {
    // 1: "Elite",
    // 2: "Weekly Starters",
  },

    9: "Flex",
    10: "Bench/Stash",
    15: "Hurt/WR1-2 When Healthy"
  },
};

// A trade within this margin (0.05 = 5%) is called "fair".

<script>
(function () {
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = n => Math.round(n).toLocaleString("en-US");

  /* ---------- Load data ---------- */
  function parseCSV(text) {
    const rows = [];
    for (const raw of text.trim().split(/\r?\n/)) {
      const line = raw.trim();
      if (!line || line.startsWith("#")) continue;
      const cells = []; let cur = "", q = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (q) {
          if (ch === '"' && line[i + 1] === '"') { cur += '"'; i++; }
          else if (ch === '"') q = false;
          else cur += ch;
        } else if (ch === '"') q = true;
        else if (ch === ",") { cells.push(cur.trim()); cur = ""; }
        else cur += ch;
      }
      cells.push(cur.trim());
      rows.push(cells);
    }
    return rows;
  }

  function loadPlayers() {
    const rows = parseCSV(RANKINGS_CSV);
    if (!rows.length) return [];
    const head = rows.shift().map(h => h.toLowerCase());
    const players = rows.map((r, i) => {
      const get = n => { const c = head.indexOf(n); return c < 0 ? "" : (r[c] ?? ""); };
      const rank = parseInt(get("rank"), 10);
      const posNum = parseInt(get("pos_rank"), 10);
      const value = parseFloat(String(get("value")).replace(/,/g, ""));
      return {
        id: i,
        rank: isFinite(rank) ? rank : null,
        posNum: isFinite(posNum) ? posNum : null,
        name: get("player"),
        pos: get("pos").toUpperCase(),
        team: get("team").toUpperCase(),
        tier: get("tier"),
        overallTier: get("overall_tier"),
        projPPG: isFinite(parseFloat(get("proj_ppg"))) ? parseFloat(get("proj_ppg")) : null,
        projScore: isFinite(parseFloat(get("proj_score"))) ? parseFloat(get("proj_score")) : null,
        projRank: null,
        games: parseInt(get("games"), 10) || 0,
        value: isFinite(value) ? value : null
      };
    }).filter(p => p.name);

    const isPlayer = p => p.pos !== "PICK";

    // Projection rank: re-order the board's own rank spots by projection score,
    // so the projection can disagree with your order without shifting everyone down
    const posGroups = {};
    players.filter(p => isPlayer(p) && p.posNum != null && p.projScore != null)
      .forEach(p => (posGroups[p.pos] = posGroups[p.pos] || []).push(p));
    for (const g of Object.values(posGroups)) {
      const slots = g.map(p => p.posNum).sort((a, b) => a - b);
      [...g].sort((a, b) => b.projScore - a.projScore).forEach((p, i) => { p.projRank = slots[i]; });
    }

    // Value model: players without a typed value get one from positional rank
    players.forEach(p => {
      if (p.value == null && p.posNum != null && typeof modelValue === "function") {
        p.value = modelValue(p.pos, p.posNum, p.projRank, p.games);
        p.modelValued = true;
      }
    });
    if (typeof VALUE_MODEL === "object" && VALUE_MODEL.keepRankOrder) keepRankOrder(players.filter(p => p.modelValued));
    applyTiers(players.filter(p => p.modelValued));
    if (typeof VALUE_MODEL === "object" && VALUE_MODEL.keepRankOrder) keepRankOrder(players.filter(p => p.modelValued));
    players.forEach(p => { if (p.modelValued) p.value = Math.round(p.value); });

    // Overall order: hand-set ranks first, then everyone else by value
    const ranked = players.filter(p => isPlayer(p) && p.rank != null).sort((a, b) => a.rank - b.rank);
    const byValue = players.filter(p => isPlayer(p) && p.rank == null && p.value != null).sort((a, b) => b.value - a.value);
    let next = ranked.length ? Math.max(...ranked.map(p => p.rank)) : 0;
    byValue.forEach(p => { p.rank = ++next; });

    // No value yet: derive one from overall rank so the trade calculator still works
    players.forEach(p => {
      p.hasValue = p.value != null;
      if (p.value == null) p.value = p.rank != null ? Math.round(10000 * Math.pow(0.965, p.rank - 1)) : 0;
    });

    // Positional rank: use yours if given, otherwise count down the overall board
    const counts = {};
    players.filter(p => isPlayer(p) && p.posNum == null && p.rank != null)
      .sort((a, b) => a.rank - b.rank)
      .forEach(p => { counts[p.pos] = (counts[p.pos] || 0) + 1; p.posNum = counts[p.pos]; });
    players.forEach(p => { p.posRank = p.pos + (p.posNum ?? ""); });
    return players;
  }

  // Rank order: closest values to the model's that never increase down your
  // positional ranking (pool-adjacent-violators), then a 0.5% step inside each
  // pooled group so the player you ranked higher stays ahead.
  function keepRankOrder(list) {
    const byPos = {};
    list.filter(p => p.posNum != null).forEach(p => (byPos[p.pos] = byPos[p.pos] || []).push(p));
    for (const g of Object.values(byPos)) {
      g.sort((a, b) => a.posNum - b.posNum);
      const blocks = [];
      g.forEach(p => {
        blocks.push({ sum: p.value, n: 1, members: [p] });
        while (blocks.length > 1) {
          const b = blocks[blocks.length - 1], a = blocks[blocks.length - 2];
          if (a.sum / a.n >= b.sum / b.n) break;
          a.sum += b.sum; a.n += b.n; a.members.push(...b.members); blocks.pop();
        }
      });
      blocks.forEach(b => {
        const mean = b.sum / b.n;
        b.members.forEach((p, k) => { p.value = mean * (1 + 0.005 * ((b.n - 1) / 2 - k)); });
      });
    }
  }

  // Tier adjustment for model values: pull each tier toward its average,
  // then make sure every tier starts at least tierMinDrop below the one above.
  function applyTiers(list) {
    const m = typeof VALUE_MODEL === "object" ? VALUE_MODEL : {};
    const blend = Number(m.tierBlend) || 0, minDrop = Number(m.tierMinDrop) || 0;
    const isTag = p => Number(p.tier) >= (Number(m.tagTierFrom) || Infinity);
    const byPos = {};
    list.filter(p => p.tier !== "").forEach(p => (byPos[p.pos] = byPos[p.pos] || []).push(p));
    for (const group of Object.values(byPos)) {
      group.sort((a, b) => a.posNum - b.posNum);
      const tiers = {};
      group.forEach(p => (tiers[p.tier] = tiers[p.tier] || []).push(p));
      for (const t of Object.values(tiers)) {
        if (isTag(t[0])) continue;
        const mean = t.reduce((sum, p) => sum + p.value, 0) / t.length;
        t.forEach(p => { p.value = mean + (p.value - mean) * (1 - blend); });
      }
      let scale = 1, prev = null;
      group.forEach(p => {
        if (isTag(p)) { p.value *= scale; return; }
        let v = p.value * scale;
        if (prev && p.tier !== prev.tier && v > prev.value * (1 - minDrop)) {
          const cap = prev.value * (1 - minDrop);
          scale *= cap / v; v = cap;
        }
        p.value = v; prev = p;
      });
    }
    // Rescale so the most valuable model-valued player is back at 10,000
    const top = Math.max(0, ...list.map(p => p.value));
    list.forEach(p => { p.value = Math.round(top > 0 ? p.value * 10000 / top : p.value); });
  }

  const players = loadPlayers();
  const byId = new Map(players.map(p => [p.id, p]));
  const maxValue = Math.max(1, ...players.map(p => p.value));
  const hasPicks = players.some(p => p.pos === "PICK");

  /* ---------- Header / footer ---------- */
  const nm = esc(SITE.name);
  $("brand-name").innerHTML = nm.length > 2 ? nm.slice(0, 2) + "<span>" + nm.slice(2) + "</span>" : nm;
  $("brand-tag").textContent = SITE.tagline;
  $("meta").textContent = [SITE.format, "Updated " + SITE.updated].filter(Boolean).join("  ·  ");
  $("footer-text").textContent = "Rankings and trade model by " + SITE.author + ". Values reflect " + SITE.format + " scoring.";
  $("sample-notice").hidden = !SITE.sampleData;
  if (SITE.sampleNote) $("sample-note").textContent = SITE.sampleNote;

  /* ---------- Tabs ---------- */
  const tabs = { rankings: $("tab-rankings"), trade: $("tab-trade") };
  function showTab(name) {
    for (const [k, btn] of Object.entries(tabs)) {
      const on = k === name;
      btn.setAttribute("aria-selected", on);
      $("panel-" + k).hidden = !on;
    }
  }
  tabs.rankings.addEventListener("click", () => { showTab("rankings"); history.replaceState(null, "", "#rankings"); });
  tabs.trade.addEventListener("click", () => { showTab("trade"); history.replaceState(null, "", "#trade"); });
  showTab(location.hash === "#trade" ? "trade" : "rankings");

  /* ---------- Rankings ---------- */
  const filters = ["ALL", "QB", "RB", "WR", "TE"].concat(hasPicks ? ["PICK"] : []);
  let posFilter = "ALL", query = "";

  $("pos-chips").innerHTML = filters.map(f =>
    `<button class="chip-btn" type="button" data-pos="${f}" aria-pressed="${f === posFilter}">${f === "ALL" ? "All" : f === "PICK" ? "Picks" : f}</button>`
  ).join("");
  $("pos-chips").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    posFilter = b.dataset.pos;
    $("pos-chips").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    renderRankings();
  });
  $("rank-search").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); renderRankings(); });

  function valueCell(p) {
    if (!p.hasValue) return `<span class="num-empty">Value pending</span>`;
    const pct = Math.max(2, (p.value / maxValue) * 100);
    return `<div class="valbar pos-${p.pos}" style="--c: var(--${p.pos.toLowerCase()}, var(--ink))">
      <div class="track"><div class="fill" style="width:${pct.toFixed(1)}%"></div></div>
      <span class="num">${fmt(p.value)}</span></div>`;
  }

  function tierLabel(pos, tier) {
    const names = typeof TIER_NAMES === "object" && TIER_NAMES ? TIER_NAMES : {};
    const own = pos === "OVERALL" ? names.OVERALL : names[pos];
    const name = (own && own[tier]) || (pos !== "OVERALL" && names.ALL && names.ALL[tier]) || "";
    return name ? `Tier ${tier} · ${name}` : `Tier ${tier}`;
  }

  const POS_ORDER = { QB: 0, RB: 1, WR: 2, TE: 3 };
  const POS_NAMES = { QB: "Quarterbacks", RB: "Running backs", WR: "Wide receivers", TE: "Tight ends" };
  const hasOverall = players.some(p => p.pos !== "PICK" && p.rank != null);
  const byPos = (a, b) => (POS_ORDER[a.pos] ?? 9) - (POS_ORDER[b.pos] ?? 9) || (a.posNum ?? 1e9) - (b.posNum ?? 1e9);

  function renderRankings() {
    let list, rk, group;
    if (posFilter === "PICK") {
      list = players.filter(p => p.pos === "PICK").sort((a, b) => b.value - a.value);
      rk = () => "–"; group = () => null;
    } else if (posFilter === "ALL") {
      list = players.filter(p => p.pos !== "PICK");
      if (hasOverall) {
        list.sort((a, b) => (a.rank ?? 1e9) - (b.rank ?? 1e9) || byPos(a, b));
        rk = p => p.rank ?? "–";
        group = p => p.overallTier ? tierLabel("OVERALL", p.overallTier) : null;
      } else {
        // Positional stage: no overall board yet, so show each position in turn
        list.sort(byPos);
        rk = p => p.posNum ?? "–";
        group = p => POS_NAMES[p.pos] || p.pos;
      }
    } else {
      list = players.filter(p => p.pos === posFilter).sort(byPos);
      rk = p => p.posNum ?? "–";
      group = p => p.tier ? tierLabel(p.pos, p.tier) : null;
    }
    if (query) list = list.filter(p => (p.name + " " + p.team).toLowerCase().includes(query));
    $("rk-head").textContent = posFilter === "ALL" && hasOverall ? "Rk" : posFilter === "PICK" ? "" : "Pos Rk";

    const out = [];
    let lastGroup = null;
    list.forEach(p => {
      const g = group(p);
      if (g && g !== lastGroup && !query) {
        out.push(`<tr class="tier"><td colspan="4">${esc(g)}</td></tr>`);
      }
      lastGroup = g;
      out.push(`<tr class="player">
        <td class="rk">${rk(p)}</td>
        <td><span class="pl-name">${esc(p.name)}</span>${p.team ? `<span class="pl-team">${esc(p.team)}</span>` : ""}</td>
        <td><span class="pos ${esc(p.pos)}">${esc(p.posRank)}</span></td>
        <td class="val">${valueCell(p)}</td>
      </tr>`);
    });
    $("rank-body").innerHTML = out.length ? out.join("") :
      `<tr><td class="empty" colspan="4">No players match “${esc(query)}”.</td></tr>`;
    $("rank-count").textContent = list.length + (posFilter === "PICK" ? " picks" : " players");
  }
  renderRankings();

  /* ---------- Trade calculator ---------- */
  const sides = { A: [], B: [] };
  const inTrade = id => sides.A.includes(id) || sides.B.includes(id);

  function matches(q) {
    q = q.toLowerCase();
    return players
      .filter(p => !inTrade(p.id) && (p.name + " " + p.team + " " + p.pos).toLowerCase().includes(q))
      .sort((a, b) => b.value - a.value)
      .slice(0, 8);
  }

  function setupPicker(side) {
    const input = $("search-" + side), list = $("results-" + side);
    let hl = 0, current = [];
    const close = () => { list.hidden = true; list.innerHTML = ""; current = []; };
    const draw = () => {
      const q = input.value.trim();
      if (!q) return close();
      current = matches(q);
      hl = 0;
      list.innerHTML = current.length ? current.map((p, i) =>
        `<li><button type="button" data-id="${p.id}" class="${i === hl ? "hl" : ""}">
          <span class="pos ${esc(p.pos)}">${esc(p.posRank)}</span>
          <span class="r-name">${esc(p.name)}</span>
          <span class="r-val">${fmt(p.value)}</span></button></li>`).join("")
        : `<li class="empty" style="padding:10px">No match</li>`;
      list.hidden = false;
    };
    const highlight = () => list.querySelectorAll("button").forEach((b, i) => b.classList.toggle("hl", i === hl));
    const add = id => { sides[side].push(id); input.value = ""; close(); renderTrade(); input.focus(); };

    input.addEventListener("input", draw);
    input.addEventListener("focus", draw);
    input.addEventListener("blur", () => setTimeout(close, 120));
    input.addEventListener("keydown", e => {
      if (e.key === "ArrowDown" && current.length) { hl = (hl + 1) % current.length; highlight(); e.preventDefault(); }
      else if (e.key === "ArrowUp" && current.length) { hl = (hl - 1 + current.length) % current.length; highlight(); e.preventDefault(); }
      else if (e.key === "Enter" && current[hl]) { add(current[hl].id); e.preventDefault(); }
      else if (e.key === "Escape") { input.value = ""; close(); }
    });
    list.addEventListener("mousedown", e => e.preventDefault());
    list.addEventListener("click", e => { const b = e.target.closest("button"); if (b) add(Number(b.dataset.id)); });

    $("roster-" + side).addEventListener("click", e => {
      const b = e.target.closest("button.remove"); if (!b) return;
      sides[side] = sides[side].filter(id => id !== Number(b.dataset.id));
      renderTrade();
    });
  }
  setupPicker("A");
  setupPicker("B");

  function runModel(aIds, bIds) {
    try {
      const r = tradeModel(aIds.map(id => byId.get(id)), bIds.map(id => byId.get(id))) || {};
      return { a: Number(r.scoreA) || 0, b: Number(r.scoreB) || 0, rawA: r.rawA, rawB: r.rawB, note: r.note || "" };
    } catch (err) {
      console.error(err);
      return { a: 0, b: 0, note: "The trade model threw an error: " + err.message, error: true };
    }
  }

  function renderRoster(side) {
    const ids = sides[side];
    $("roster-" + side).innerHTML = ids.length ? ids.map(id => {
      const p = byId.get(id);
      return `<li><span class="pos ${esc(p.pos)}">${esc(p.posRank)}</span>
        <span class="n">${esc(p.name)}</span><span class="v">${fmt(p.value)}</span>
        <button class="remove" type="button" data-id="${id}" aria-label="Remove ${esc(p.name)}">×</button></li>`;
    }).join("") : `<li class="roster-empty" style="background:none">No players added yet.</li>`;
  }

  function renderTrade() {
    renderRoster("A");
    renderRoster("B");
    const res = runModel(sides.A, sides.B);
    $("total-A").textContent = fmt(res.rawA ?? res.a);
    $("total-B").textContent = fmt(res.rawB ?? res.b);
    $("score-A").textContent = "Team A · " + fmt(res.a);
    $("score-B").textContent = fmt(res.b) + " · Team B";

    const title = $("verdict-title"), sub = $("verdict-sub"), meter = $("meter");
    const note = $("model-note");
    note.hidden = !res.note; note.textContent = res.note;
    $("balance").hidden = true;

    if (!sides.A.length && !sides.B.length) {
      title.className = ""; title.textContent = "Build a trade";
      sub.textContent = "Add what each team gets to see who wins.";
      meter.classList.add("idle"); $("meter-a").style.width = "50%";
      return;
    }
    meter.classList.remove("idle");
    const total = res.a + res.b;
    $("meter-a").style.width = (total > 0 ? (res.a / total) * 100 : 50).toFixed(1) + "%";

    const hi = Math.max(res.a, res.b);
    const gap = hi > 0 ? Math.abs(res.a - res.b) / hi : 0;
    if (gap <= FAIR_MARGIN) {
      title.className = "fair"; title.textContent = "Fair trade";
      sub.textContent = `Within ${Math.round(FAIR_MARGIN * 100)}% on the model (${(gap * 100).toFixed(1)}% apart).`;
      return;
    }
    const winner = res.a > res.b ? "A" : "B", loser = winner === "A" ? "B" : "A";
    title.className = "win-" + winner; title.textContent = `Team ${winner} wins`;
    sub.textContent = `Team ${winner} gets ${(gap * 100).toFixed(1)}% more value.`;

    // Suggest additions for the trailing side that bring the trade closest to even
    const pool = players.filter(p => !inTrade(p.id));
    const scored = pool.map(p => {
      const a = loser === "A" ? sides.A.concat(p.id) : sides.A;
      const b = loser === "B" ? sides.B.concat(p.id) : sides.B;
      const r = runModel(a, b);
      const m = Math.max(r.a, r.b);
      return { p, gap: m > 0 ? Math.abs(r.a - r.b) / m : 1 };
    }).filter(s => s.gap < gap).sort((x, y) => x.gap - y.gap).slice(0, 4);

    if (scored.length) {
      $("balance-title").textContent = `To even it out, add to Team ${loser}`;
      $("balance-list").innerHTML = scored.map(s =>
        `<button class="suggest" type="button" data-id="${s.p.id}" data-side="${loser}">
          <span class="pos ${esc(s.p.pos)}">${esc(s.p.posRank)}</span>${esc(s.p.name)}
          <span class="r-val">${fmt(s.p.value)}</span></button>`).join("");
      $("balance").hidden = false;
    }
  }

  $("balance-list").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    sides[b.dataset.side].push(Number(b.dataset.id));
    renderTrade();
  });
  $("swap-btn").addEventListener("click", () => { [sides.A, sides.B] = [sides.B, sides.A]; renderTrade(); });
  $("clear-btn").addEventListener("click", () => { sides.A = []; sides.B = []; renderTrade(); });

  // Open with an example trade so the calculator shows what it does
  const find = n => players.find(p => p.name === n);
  const ex = [find("Jahmyr Gibbs")], exB = [find("Ashton Jeanty"), find("Kyren Williams")];
  if (ex.every(Boolean) && exB.every(Boolean)) { sides.A = ex.map(p => p.id); sides.B = exB.map(p => p.id); }
  renderTrade();
})();
</script>
</body>
</html>
