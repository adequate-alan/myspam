name: Build and deploy site

on:
  push:
    branches: [main]
  schedule:
    # Tuesdays 14:00 UTC = 10 AM Eastern (9 AM once clocks fall back), after Monday Night Football
    - cron: "0 14 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: "3.12"

      - name: Refresh projections and stats (weekly / manual runs only)
        if: github.event_name != 'push'
        working-directory: pipeline
        run: |
          pip install pandas numpy
          python project_players.py
          python merge_projections.py ../index.html
          python build_sleeper_ids.py ../index.html
          python build_stats.py 2026
          python stamp_date.py ../index.html

      - name: Commit refreshed site
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/sleeper_players.json data/platform_ids.json data/stats/2026.json
          git diff --cached --quiet || git commit -m "Weekly projections and stats refresh"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
