name: Build and deploy site

on:
  push:
    branches: [main]
  # pull requests run the same checks, never deploy
  pull_request:
    branches: [main]
  schedule:
    # Weekly full refresh: Tuesdays 14:00 UTC = 10 AM Eastern (9 AM once clocks fall back), after Monday Night Football.
    # Projections (RANKINGS_CSV proj columns + data/projections.json), Sleeper IDs, stats and the ranking-history
    # snapshot. Never changes ranks or tiers. Projections stay current and count a flat 20% of model values
    # (Alan, Oct 5), so values of players without a typed value can shift a little; typed values never move.
    - cron: "0 14 * * 2"
    # Stats-only refreshes after every NFL game day (game logs, totals, fantasy points). Two tries each,
    # because nflverse usually posts a day's stats overnight but sometimes later in the morning.
    - cron: "30 8 * * 5"    # Fri 4:30 AM ET: after Thursday Night Football
    - cron: "0 15 * * 5"    # Fri 11 AM ET: retry
    - cron: "30 8 * * 0"    # Sun 4:30 AM ET: after Saturday games (late season)
    - cron: "0 15 * * 0"    # Sun 11 AM ET: retry
    - cron: "0 5 * * 1"     # Mon 1 AM ET (EDT; midnight once clocks fall back): Sunday games, incl. SNF
    - cron: "30 8 * * 1"    # Mon 4:30 AM ET: after Sunday's games
    - cron: "0 15 * * 1"    # Mon 11 AM ET: retry
    - cron: "30 8 * * 2"    # Tue 4:30 AM ET: after Monday Night Football
    - cron: "0 15 * * 4"    # Thu 11 AM ET: catch stat corrections before the next game day
    - cron: "0 22 * * 3"    # Wed 6 PM ET: first injury/practice report of the week
    - cron: "0 22 * * 4"    # Thu 6 PM ET: practice report update
    - cron: "0 22 * * 5"    # Fri 6 PM ET: final practice report with game statuses
    - cron: "45 16 * * 3"   # Wed 12:45 PM ET: midweek refresh (FantasyCalc market values, depth charts, stats)
    - cron: "45 16 * * 6"   # Sat 12:45 PM ET: pre-Sunday refresh (market values, depth charts, stats)
    # FantasyCalc market values only, every 8 hours (Alan, Oct 9): 00:20, 08:20 and 16:20 UTC. Stdlib only, no
    # stats, projections or snapshot; failures keep the last file. Never touches ranks, tiers or values.
    - cron: "20 */8 * * *"
    # Nightly full CI (Alan, Oct 14): the whole regression suite on main, 07:15 UTC = 3:15 AM ET. Never deploys, never
    # refreshes data, runs in its own concurrency group, so it can't delay a push. A failure shows as a red run.
    - cron: "15 7 * * *"
  workflow_dispatch:
    inputs:
      stats_only:
        description: "Only refresh player stats (game logs), not projections or ranking history"
        type: boolean
        default: false
      full_ci:
        description: "Run full CI: the whole regression suite on this branch, no data refresh, no deploy"
        type: boolean
        default: false

# Least privilege per job (Phase 1): only the data refresh can push, only the deploy can publish Pages.
permissions:
  contents: read

# Release runs (pushes) cancel the run they supersede, so a new push never waits behind an obsolete commit. Pull requests
# do the same per branch. The nightly / manual full CI and the scheduled data refresh have their own groups and never
# cancel: a 12-minute nightly suite can't delay a push. Deploys are serialized separately (the deploy job's own group).
concurrency:
  group: ${{ github.event_name == 'push' && 'release' || github.event_name == 'pull_request' && format('pr-{0}', github.ref) || ((github.event_name == 'schedule' && github.event.schedule == '15 7 * * *') || (github.event_name == 'workflow_dispatch' && inputs.full_ci)) && 'full-ci' || 'refresh' }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

# Release flow (Alan, Oct 14: three lanes, tests/release_tier.py; CI speed pass Oct 13):
#   refresh (scheduled / manual only)  pipeline jobs → static checks on the result (rankings must not change) → commit
#   plan                                no browser: the commit, its code fingerprint and the lane, from the diff since the
#                                       nearest commit whose code already passed (main's records, or a same-repo PR's, so a
#                                       merged PR doesn't re-run its suites on main; a merge's second parent counts):
#     fast      CSS, copy and labels, docs, comments, data → deploy right after verify (~2 min)
#     targeted  known UI features of one family → their suites (job `targeted`, the independent suites and the
#               timing-sensitive drag suites on two runners at once) → deploy (~4–7 min; an editor feature ~6–9).
#               A browser / server crash in a suite is retried once inside the job (tests/run_ci.py), never the job
#     full      risky / core / unknown / CI → the whole suite (job `full`, 4 shards, 2 suites at a time) → deploy
#   verify                              static + pipeline + smoke checks on the exact commit, beside the lane's suites
#                                       (they start together; nothing deploys unless both pass)
#   build → deploy                      only after the lane's checks passed, and only if the commit is still main's head;
#                                       build stamps BUILD_ID with a hash of the page's code (the repo keeps "dev");
#                                       pull requests, the nightly run and manual full CI never deploy
#   mark-verified                       records the code fingerprint once its lane passed (the next push diffs from it)
# Every job uses !cancelled(), never always(): a run cancelled by a newer push stops at once instead of finishing its
# suites while the new run waits in the same concurrency group (Oct 13: that queue cost 7–11 minutes per push).
# No trailing full suite after fast or targeted releases: it runs nightly and on demand (Run workflow → full_ci).
# Known baseline failures and advisory timing checks are listed in tests/ci_policy.json.
jobs:
  refresh:
    timeout-minutes: 45
    if: (github.event_name == 'schedule' && github.event.schedule != '15 7 * * *') || (github.event_name == 'workflow_dispatch' && !inputs.full_ci)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.done.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pick refresh type
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "20 */8 * * *" ]; then echo "stats=market" >> "$GITHUB_OUTPUT";
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "0 14 * * 2" ]; then echo "stats=true" >> "$GITHUB_OUTPUT";
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.stats_only }}" = "true" ]; then echo "stats=true" >> "$GITHUB_OUTPUT";
          else echo "stats=false" >> "$GITHUB_OUTPUT"; fi

      - name: Refresh player stats only (after game days / editor refresh)
        if: steps.mode.outputs.stats == 'true'
        working-directory: pipeline
        run: |
          pip install pandas numpy
          python build_stats.py 2026
          python build_opportunity.py 2026 || echo "Expected points not refreshed (kept the last file)"
          python build_depth_charts.py || echo "Depth charts not refreshed (kept the last file)"
          python build_roles.py 2026 || echo "Roles not refreshed (kept the last file)"
          python build_market.py || echo "Market values not refreshed (kept the last file)"

      - name: Refresh FantasyCalc market values only (every 8 hours)
        if: steps.mode.outputs.stats == 'market'
        working-directory: pipeline
        run: python build_market.py || echo "Market values not refreshed (kept the last file)"

      - name: Refresh projections and stats (weekly / manual runs only)
        if: steps.mode.outputs.stats == 'false'
        working-directory: pipeline
        run: |
          pip install pandas numpy
          python build_sleeper_ids.py ../index.html
          python build_stats.py 2026
          python project_players.py
          python merge_projections.py ../index.html --json ../data/projections.json
          python merge_projections.py ../index.html
          python build_depth_charts.py || echo "Depth charts not refreshed (kept the last file)"
          python build_roles.py 2026 || echo "Roles not refreshed (kept the last file)"
          python snapshot_projections.py
          python build_opportunity.py 2026 || echo "Expected points not refreshed (kept the last file)"
          python build_market.py || echo "Market values not refreshed (kept the last file)"

      - name: Scheduled ranking-history snapshot (weekly / manual runs only)
        if: steps.mode.outputs.stats == 'false'
        working-directory: pipeline
        run: |
          pip install -r ../tests/requirements-ci.txt
          python -m playwright install --with-deps chromium
          python snapshot_history.py

      # Nothing scheduled may change a rank, tier, value or source, drop a player or rewrite history (CLAUDE.md §2, §8).
      # A failure here stops before the commit, so nothing is committed or deployed.
      - name: Check the refreshed data before committing
        run: python tests/static_check.py --base HEAD --frozen-rankings

      - name: Commit refreshed site
        id: done
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/sleeper_players.json data/platform_ids.json data/stats/2026.json data/rank_history.json
          if [ -d data/rank_snapshots ]; then git add data/rank_snapshots; fi
          if [ -f data/depth_charts.json ]; then git add data/depth_charts.json; fi
          if [ -f data/roles.json ]; then git add data/roles.json; fi
          if [ -f data/projections.json ]; then git add data/projections.json; fi
          if [ -d data/projections ]; then git add data/projections; fi
          if [ -f data/market/redraft.json ]; then git add data/market/redraft.json; fi
          if [ -d data/opportunity ]; then git add data/opportunity; fi
          git diff --cached --quiet || git commit -m "${{ steps.mode.outputs.stats == 'market' && 'Market values refresh' || steps.mode.outputs.stats == 'true' && 'Player stats refresh' || 'Weekly projections and stats refresh' }}"
          git pull --rebase origin main && git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Picks the lane in ~20 s (git + Python, no browser), so the lane's suites start right away instead of after the fast
  # checks; the fast checks run beside them in `verify` and every deploy still needs both.
  # Cancellation (Oct 13): every job below uses !cancelled(), never always(). A job whose `if` is always() keeps running
  # when its run is cancelled, so a superseded run's suites ran to the end and the newer run (same concurrency group)
  # queued behind them: PR #33's three pushes took 44 minutes end to end for 15 minutes of checks.
  plan:
    needs: refresh
    if: "!cancelled() && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read         # lists the verified-code records (Actions cache keys) to find the last commit that passed
      pull-requests: read   # a record from a pull request counts only when that pull request's branch is in this repo
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
      lane: ${{ steps.lane.outputs.lane }}
      suites: ${{ steps.lane.outputs.suites }}
      deploy: ${{ steps.ref.outputs.deploy }}
      fingerprint: ${{ steps.fp.outputs.fp }}
    steps:
      - id: ref
        run: |
          echo "sha=${{ needs.refresh.outputs.sha || github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_OUTPUT"
          # deploy: pushes and scheduled data refreshes; never pull requests, the nightly run or manual full CI
          echo "deploy=${{ github.event_name == 'push' || (github.event_name == 'schedule' && github.event.schedule != '15 7 * * *') || (github.event_name == 'workflow_dispatch' && !inputs.full_ci) }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.sha }}
          fetch-depth: 60   # reaches the last verified commit (tests/release_tier.py walks back up to 30 first parents)
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Code fingerprint
        id: fp
        run: echo "fp=$(python tests/release_fingerprint.py)" >> "$GITHUB_OUTPUT"
      - name: Pick the release lane
        id: lane
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # verified-code records: main's, and those of pull requests whose branch lives in this repository (a fork's
          # run could write any key, so its records never count). If GitHub can't list them, the lane is full.
          gh api -X GET "repos/$REPO/actions/caches" -f key=verified- -f per_page=100 --paginate \
            --jq '.actions_caches[] | "\(.key) \(.ref)"' > "$RUNNER_TEMP/caches" || : > "$RUNNER_TEMP/caches"
          declare -A own
          while read -r key ref; do
            case "$ref" in
              refs/heads/main) echo "$key" ;;
              refs/pull/*/merge)
                n=${ref#refs/pull/}; n=${n%/merge}
                [ -n "${own[$n]+x}" ] || own[$n]=$(gh api "repos/$REPO/pulls/$n" --jq .head.repo.full_name 2>/dev/null || true)
                [ "${own[$n]}" = "$REPO" ] && echo "$key" ;;
            esac
          done < "$RUNNER_TEMP/caches" > "$RUNNER_TEMP/ok-keys"
          echo "$(wc -l < "$RUNNER_TEMP/ok-keys") verified-code records usable"
          python tests/release_tier.py --head HEAD --ok-keys "$RUNNER_TEMP/ok-keys" \
            --github-output ${{ ((github.event_name == 'schedule' && github.event.schedule == '15 7 * * *') || (github.event_name == 'workflow_dispatch' && inputs.full_ci) || contains(github.event.pull_request.labels.*.name, 'full-ci')) && '--force-full' || '' }}

  # The fast checks (static + pipeline + smoke), on every run whatever the lane.
  verify:
    needs: plan
    if: "!cancelled() && needs.plan.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 60   # the comparison commit for static_check
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the test browser (pinned Playwright + its Chromium)
        timeout-minutes: 8   # normally ~30 s; a hung apt/browser download fails fast instead of holding a release (Oct 14: 14+ min hang)
        run: |
          pip install -r tests/requirements-ci.txt
          python -m playwright install --with-deps --only-shell chromium
      - name: Pick the comparison commit
        id: base
        run: |
          before="${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha || '' }}"
          if [ -n "$before" ] && git cat-file -e "$before^{commit}" 2>/dev/null; then echo "args=--base $before" >> "$GITHUB_OUTPUT";
          elif git cat-file -e HEAD~1 2>/dev/null; then echo "args=--base HEAD~1" >> "$GITHUB_OUTPUT"; fi
      - name: Static checks and smoke test
        run: python tests/run_ci.py fast --jobs 3 --logs "$RUNNER_TEMP/ci-logs" --static-args "${{ steps.base.outputs.args }}"
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-fast
          path: ${{ runner.temp }}/ci-logs
          retention-days: 14

  # !cancelled(): GitHub skips a job without a status function whenever ANY upstream job was skipped, and `refresh` is
  # skipped on every push and pull request (PR #1's first run skipped the full suite that way).
  targeted:
    needs: plan
    if: "!cancelled() && needs.plan.result == 'success' && needs.plan.outputs.lane == 'targeted'"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [shared, exclusive]   # the independent suites together; the timing-sensitive drag suites alone
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the test browser (pinned Playwright + its Chromium)
        timeout-minutes: 8   # normally ~30 s; a hung apt/browser download fails fast instead of holding a release (Oct 14: 14+ min hang)
        run: |
          pip install -r tests/requirements-ci.txt
          python -m playwright install --with-deps --only-shell chromium
      - name: The changed features' suites, ${{ matrix.group }} group (${{ needs.plan.outputs.suites }})
        run: python tests/run_ci.py targeted --suites "${{ needs.plan.outputs.suites }}" --group ${{ matrix.group }} --jobs 3 --logs "$RUNNER_TEMP/ci-logs"
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-targeted-${{ matrix.group }}
          path: ${{ runner.temp }}/ci-logs
          retention-days: 14

  # The whole suite on 4 runners, 2 independent suites at a time on each (4 cores); the timing-sensitive drag suites
  # run alone at the end of their shard; inflight_check runs as 2 parts (tests/ci_policy.json suites.parts).
  full:
    needs: plan
    if: "!cancelled() && needs.plan.result == 'success' && needs.plan.outputs.lane == 'full'"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the test browser (pinned Playwright + its Chromium)
        timeout-minutes: 8   # normally ~30 s; a hung apt/browser download fails fast instead of holding a release (Oct 14: 14+ min hang)
        run: |
          pip install -r tests/requirements-ci.txt
          python -m playwright install --with-deps --only-shell chromium
      - name: Full regression suite (shard ${{ matrix.shard }} of 4)
        run: python tests/run_ci.py full --shard ${{ matrix.shard }}/4 --jobs 2 --logs "$RUNNER_TEMP/ci-logs"
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-full-${{ matrix.shard }}
          path: ${{ runner.temp }}/ci-logs
          retention-days: 14

  # After the lane's checks and the fast checks passed: this exact code is verified, and the next run's lane is picked from
  # the diff since it. Pull requests from this repository record it too (scoped to the pull request), so a follow-up push
  # to the same pull request diffs from it, and the merge to main of code identical to a verified head releases on the
  # fast lane instead of running the same suites again. Forks never record.
  mark-verified:
    needs: [plan, verify, targeted, full]
    if: "!cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.plan.result == 'success' && needs.verify.result == 'success' && (needs.plan.outputs.lane == 'fast' || (needs.plan.outputs.lane == 'targeted' && needs.targeted.result == 'success') || (needs.plan.outputs.lane == 'full' && needs.full.result == 'success'))"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # an existing record is restored instead (that counts as use, so code that only changes nightly or by rankings
      # publishes isn't evicted after GitHub's 7 days without access)
      - id: have
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/verified
          key: verified-${{ needs.plan.outputs.fingerprint }}
      - if: steps.have.outputs.cache-hit != 'true'
        run: mkdir -p "$RUNNER_TEMP/verified" && echo "${{ needs.plan.outputs.sha }}" > "$RUNNER_TEMP/verified/sha"
      - if: steps.have.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/verified
          key: verified-${{ needs.plan.outputs.fingerprint }}

  build:
    needs: [plan, verify, targeted, full]
    # deploy only after the fast checks and the lane's own checks passed: fast = verify; targeted = verify + its suites;
    # full = verify + the whole suite. A lane whose check job was skipped for any other reason never deploys.
    if: "!cancelled() && needs.plan.outputs.deploy == 'true' && needs.plan.result == 'success' && needs.verify.result == 'success' && (needs.plan.outputs.lane == 'fast' || (needs.plan.outputs.lane == 'targeted' && needs.targeted.result == 'success') || (needs.plan.outputs.lane == 'full' && needs.full.result == 'success'))"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      current: ${{ steps.head.outputs.current }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: Still the newest commit on main?
        id: head
        run: |
          head=$(git ls-remote "https://github.com/${{ github.repository }}" refs/heads/main | cut -f1)
          if [ "$head" = "${{ needs.plan.outputs.sha }}" ] || [ -z "$head" ]; then echo "current=true" >> "$GITHUB_OUTPUT";
          else echo "current=false" >> "$GITHUB_OUTPUT"; echo "main moved on to $head: that commit's own run deploys it" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Stamp the build ID
        # The repo keeps BUILD_ID = "dev" (no hand bumps, so no merge conflicts on it); the deployed copy gets a hash of
        # the page's code, so open browsers are offered a refresh only when the page itself changed.
        if: steps.head.outputs.current == 'true'
        run: |
          id=$(python3 tests/release_fingerprint.py --page)
          python3 - "$id" <<'EOF'
          import re, sys
          html = open("index.html", encoding="utf-8").read()
          new, n = re.subn(r'const BUILD_ID = "dev";', f'const BUILD_ID = "{sys.argv[1]}";', html)
          if n != 1 or not re.fullmatch(r"[0-9a-f]{12}", sys.argv[1]): sys.exit(f"BUILD_ID stamp: {n} placeholders, id {sys.argv[1]!r}")
          open("index.html", "w", encoding="utf-8").write(new)
          EOF
          echo "BUILD_ID $id" >> "$GITHUB_STEP_SUMMARY"
      - if: steps.head.outputs.current == 'true'
        uses: actions/configure-pages@v5
      - if: steps.head.outputs.current == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    if: "!cancelled() && needs.build.result == 'success' && needs.build.outputs.current == 'true'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
